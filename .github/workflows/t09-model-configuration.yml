name: T09 selectable local models and runtime
on:
  pull_request:
    paths:
      - 'distribution/**'
      - 'llm/**'
      - 'api/**'
      - 'tests/test_model_selection.py'
      - 'tests/t09_config_smoke.py'
      - '.github/workflows/t09-model-configuration.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  configurable-windows-portable:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-builder.txt
          python -m pip install pyinstaller==6.22.3
      - name: Load previously verified CPU runtime, GGUF and demo DB
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41787427470 -R "$env:GITHUB_REPOSITORY" -n DK-Knowledge-Engine-Win-x64-demo-T07 -D ".\input"
          if ($LASTEXITCODE -ne 0) { throw 'Verified T07 sample artifact unavailable' }
          Expand-Archive -LiteralPath '.\input\DK-Knowledge-Engine-Win-x64.zip' -DestinationPath '.\input-extracted'
      - name: Rebuild portable API from T09 source using validated model/runtime
        shell: pwsh
        run: |
          $src=(Resolve-Path '.\input-extracted\DK-Knowledge-Engine-Win-x64').Path
          $manifest=Get-Content -LiteralPath (Join-Path $src 'manifest.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          $argsBuild = @{
            KnowledgeDb = (Join-Path $src 'knowledge\knowledge.db')
            LlamaBinDir = (Join-Path $src 'runtime')
            ModelFile = (Join-Path $src 'models\Qwen3-1.7B-Q4_K_M.gguf')
            LlamaLicense = (Join-Path $src 'licenses\llama.cpp-LICENSE')
            ModelLicense = (Join-Path $src 'licenses\Qwen3-Apache-2.0-LICENSE')
            PythonLicense = (Join-Path $src 'licenses\CPython-LICENSE')
            PyInstallerLicense = (Join-Path $src 'licenses\PyInstaller-COPYING.txt')
            OutputDir = '.\t09-output'
            LlamaCommit = $manifest.runtime_commit
          }
          & .\distribution\Build-Portable.ps1 @argsBuild
          if ($LASTEXITCODE -ne 0) { throw 'T09 portable package build failed' }
      - name: Verify real selected model/runtime on Windows CPU
        shell: pwsh
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s tests -p test_model_selection.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Model selection unit tests failed' }
          python tests/t09_config_smoke.py ".\t09-output\DK-Knowledge-Engine-Win-x64.zip"
          if ($LASTEXITCODE -ne 0) { throw 'T09 configured Windows CPU smoke failed' }
      - name: Upload tested configurable demo ZIP, not a Release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DK-Knowledge-Engine-Win-x64-configurable-T09
          path: t09-output/DK-Knowledge-Engine-Win-x64.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

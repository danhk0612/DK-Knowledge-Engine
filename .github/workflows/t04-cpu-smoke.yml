name: T04 real CPU GGUF smoke

on:
  pull_request:
    paths:
      - 'llm/**'
      - 'tests/smoke_t04_cpu.py'
      - '.github/workflows/t04-cpu-smoke.yml'
  workflow_dispatch:

jobs:
  real-qwen-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install author-side document dependencies
        run: python -m pip install -r requirements-builder.txt
      - name: Build pinned llama.cpp CPU runtime
        shell: bash
        run: |
          git clone --depth 1 --branch v0.8.0 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          git -C /tmp/llama.cpp rev-parse HEAD
          cmake -S /tmp/llama.cpp -B /tmp/llama-build -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=OFF -DLLAMA_BUILD_TESTS=OFF
          cmake --build /tmp/llama-build --config Release --target llama-cli --parallel 3
          /tmp/llama-build/bin/llama-cli --version
      - name: Fetch model and verify pinned SHA-256
        shell: bash
        run: |
          curl --fail --location --retry 3 --retry-delay 5 --output /tmp/qwen3-1.7b-q4_k_m.gguf \
            https://huggingface.co/ggml-org/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q4_K_M.gguf
          echo 'd2387ca2dbfee2ffabce7120d3770dadca0b293052bc2f0e138fdc940d9bc7b5  /tmp/qwen3-1.7b-q4_k_m.gguf' | sha256sum --check
      - name: Real Qwen CPU answer from indexed source
        shell: bash
        run: |
          python tests/smoke_t04_cpu.py \
            --llama-cli /tmp/llama-build/bin/llama-cli \
            --model /tmp/qwen3-1.7b-q4_k_m.gguf

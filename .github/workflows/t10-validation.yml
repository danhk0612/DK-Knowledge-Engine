name: T10 synthetic grounding and local security verification

on:
  pull_request:
    paths:
      - 'tests/t10_*'
      - 'docs/T10_*'
      - '.github/workflows/t10-validation.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  evidence-unit:
    name: Evaluator contract and spoofed-citation tests
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing builder test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run T10 evidence and privacy unit tests
        run: python -m unittest discover -s tests -p test_t10_quality_eval.py -v

  windows-real-portable:
    name: Real Qwen3 ZIP, two products, version isolation and HTTP boundaries
    needs: evidence-unit
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install builder dependencies for synthetic noncustomer manuals
        shell: pwsh
        run: python -m pip install -r requirements-builder.txt
      - name: Download previously validated T09 Windows ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41955872865 -R "$env:GITHUB_REPOSITORY" -n DK-Knowledge-Engine-Win-x64-configurable-T09 -D ".\t10-input"
          if ($LASTEXITCODE -ne 0) { throw 'Validated T09 ZIP artifact unavailable' }
          Expand-Archive -LiteralPath '.\t10-input\DK-Knowledge-Engine-Win-x64.zip' -DestinationPath '.\t10-extracted'
      - name: Prepare two-product, multi-version artificial knowledge DB
        shell: pwsh
        env:
          PYTHONPATH: .
        run: |
          python tests/t10_fixture.py --output ".\t10-synthetic.db"
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic DB builder failed' }
          $hash = (Get-FileHash -LiteralPath '.\t10-synthetic.db' -Algorithm SHA256).Hash.ToLowerInvariant()
          $package = '.\t10-extracted\DK-Knowledge-Engine-Win-x64'
          & (Join-Path $package 'Update-Knowledge.ps1') -SourceDb '.\t10-synthetic.db' -ExpectedSha256 $hash
          if ($LASTEXITCODE -ne 0) { throw 'Verified offline DB swap failed' }
          & (Join-Path $package 'Verify-AIHelp.ps1')
          if ($LASTEXITCODE -ne 0) { throw 'Package integrity verification after DB swap failed' }
      - name: Validate real model answer grounding and HTTP origin/host isolation
        shell: pwsh
        env:
          PYTHONPATH: .
        run: |
          python tests/t10_run_portable.py --package '.\t10-extracted\DK-Knowledge-Engine-Win-x64' --cases '.\tests\t10_cases_sample.json' --output '.\t10-reports\quality.json'
          if ($LASTEXITCODE -ne 0) { throw 'T10 quality or HTTP boundary evaluation failed' }
          $result = Get-Content '.\t10-reports\quality.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($result.failed_count -ne 0 -or $result.cases_count -ne 14) { throw 'T10 case totals or pass counts differ' }
          if ($result.verification_scope.physically_disconnected_network) { throw 'CI must not claim physical offline' }
          $content = Get-Content '.\t10-reports\quality.json' -Raw -Encoding UTF8
          if ($content.Contains('연결 오류가 발생하면') -or $content.Contains('데이터베이스 서버 포트 3308')) {
            throw 'Report leaked a question or an answer'
          }
          @(
            '### T10 verified Windows package and synthetic manual checks'
            ''
            ('- Quality and security: {0}/{1} cases passed' -f $result.passed_count, $result.cases_count)
            '- Two synthetic products and version-range ground truth verified'
            '- Chat citations checked against retrieved DB chunks'
            '- Host, Origin and OPTIONS checks performed'
            '- Synthetic-only, no customer manuals or raw AI answers uploaded'
            '- Physical network disconnect, enterprise browser and signing: not verified'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Upload redacted synthetic test evidence (not customer content)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: T10-synthetic-quality-and-http-boundaries
          path: t10-reports/quality.json
          if-no-files-found: warn
          retention-days: 7

name: T07 portable Windows offline package

on:
  pull_request:
    paths:
      - 'distribution/**'
      - 'tests/t07_*'
      - 'tests/test_distribution.py'
      - '.github/workflows/t07-portable-windows.yml'
  workflow_dispatch:

jobs:
  package-and-test:
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build-only tools
        shell: pwsh
        run: |
          python -m pip install -r requirements-builder.txt
          python -m pip install pyinstaller==6.22.3
          python -m PyInstaller --version
      - name: Generate disposable sample knowledge DB
        shell: pwsh
        env:
          PYTHONPATH: .
        run: |
          python tests/t07_prepare_db.py --output "$env:RUNNER_TEMP\demo-knowledge.db"
      - name: Build pinned llama.cpp Windows CPU runtime
        shell: pwsh
        run: |
          git clone --depth 1 --branch v0.8.0 https://github.com/ggml-org/llama.cpp.git "$env:RUNNER_TEMP\llama.cpp"
          $commit = git -C "$env:RUNNER_TEMP\llama.cpp" rev-parse HEAD
          $commit | Set-Content -Path "$env:RUNNER_TEMP\llama-commit.txt"
          cmake -S "$env:RUNNER_TEMP\llama.cpp" -B "$env:RUNNER_TEMP\llama-build" -A x64 -DGGML_CUDA=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DBUILD_SHARED_LIBS=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
          cmake --build "$env:RUNNER_TEMP\llama-build" --config Release --target llama-completion --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'CMake build failed' }
      - name: Download pinned GGUF and third-party license texts (CI builder only)
        shell: pwsh
        run: |
          curl.exe --fail --location --retry 3 --retry-delay 5 --output "$env:RUNNER_TEMP\Qwen3-1.7B-Q4_K_M.gguf" "https://huggingface.co/ggml-org/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q4_K_M.gguf"
          if ($LASTEXITCODE -ne 0) { throw 'GGUF download failed' }
          $expected = 'd2387ca2dbfee2ffabce7120d3770dadca0b293052bc2f0e138fdc940d9bc7b5'
          if ((Get-FileHash "$env:RUNNER_TEMP\Qwen3-1.7B-Q4_K_M.gguf" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'GGUF SHA mismatch' }
          curl.exe --fail --location --output "$env:RUNNER_TEMP\apache-license.txt" "https://www.apache.org/licenses/LICENSE-2.0.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Apache license download failed' }
          curl.exe --fail --location --output "$env:RUNNER_TEMP\python-license.txt" "https://raw.githubusercontent.com/python/cpython/v3.11.9/LICENSE"
          if ($LASTEXITCODE -ne 0) { throw 'CPython license download failed' }
          curl.exe --fail --location --output "$env:RUNNER_TEMP\pyinstaller-license.txt" "https://raw.githubusercontent.com/pyinstaller/pyinstaller/v6.22.3/COPYING.txt"
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller license download failed' }
      - name: Build self-contained Windows ZIP and verify manifest
        shell: pwsh
        run: |
          $runtime = "$env:RUNNER_TEMP\llama-build\bin\Release"
          if (-not (Test-Path (Join-Path $runtime 'llama-completion.exe'))) {
            $runtime = "$env:RUNNER_TEMP\llama-build\bin"
          }
          if (-not (Test-Path (Join-Path $runtime 'llama-completion.exe'))) { throw 'No Windows llama-completion executable' }
          $revision = (Get-Content -Raw "$env:RUNNER_TEMP\llama-commit.txt").Trim()
          & .\distribution\Build-Portable.ps1 -KnowledgeDb "$env:RUNNER_TEMP\demo-knowledge.db" -LlamaBinDir $runtime -ModelFile "$env:RUNNER_TEMP\Qwen3-1.7B-Q4_K_M.gguf" -LlamaLicense "$env:RUNNER_TEMP\llama.cpp\LICENSE" -ModelLicense "$env:RUNNER_TEMP\apache-license.txt" -PythonLicense "$env:RUNNER_TEMP\python-license.txt" -PyInstallerLicense "$env:RUNNER_TEMP\pyinstaller-license.txt" -OutputDir ".\dist-artifact" -LlamaCommit $revision
          if ($LASTEXITCODE -ne 0) { throw 'Portable build failed' }
      - name: Extract ZIP to new path, verify real CPU chat and DB rollback
        shell: pwsh
        env:
          PYTHONPATH: .
        run: |
          python tests/t07_package_smoke.py ".\dist-artifact\DK-Knowledge-Engine-Win-x64.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Portable ZIP smoke failed' }
      - name: Upload validated Windows demo ZIP (sample data; not Release)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DK-Knowledge-Engine-Win-x64-demo-T07
          path: dist-artifact/DK-Knowledge-Engine-Win-x64.zip
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

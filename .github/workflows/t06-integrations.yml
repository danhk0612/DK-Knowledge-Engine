name: T06 web and Windows integration

on:
  pull_request:
    paths:
      - 'integrations/**'
      - 'tests/t06_*'
      - 'package.json'
      - '.github/workflows/t06-integrations.yml'
  workflow_dispatch:

jobs:
  browser:
    name: Chromium browser integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install offline Builder dependencies (CI setup only)
        run: python -m pip install -r requirements-builder.txt
      - name: Install browser testing tools (CI setup only)
        run: npm install --ignore-scripts
      - name: Install Chromium (CI testing only)
        run: npx playwright install chromium
      - name: Call real localhost API from Chromium browser
        run: npm run test:t06-browser

  windows-csharp:
    name: Windows WPF build and C# localhost smoke
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Builder dependencies
        run: python -m pip install -r requirements-builder.txt
      - name: Build WPF example and exercise shared client on real localhost TCP
        env:
          PYTHONPATH: .
        run: python tests/t06_windows_smoke.py

name: T12 separated Admin and Client Windows GUIs

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'llm/**'
      - 'distribution/Build-Client-Package.ps1'
      - 'distribution/Build-Admin-Package.ps1'
      - 'distribution/Set-Exe-Icon.ps1'
      - 'distribution/templates/Verify-AIHelp.ps1'
      - 'assets/**'
      - 'distribution/builder_entry.py'
      - '.github/workflows/t12-windows-guis.yml'
      - 'tests/v020_client_gui_smoke.ps1'
      - 'tests/v020_client_engine_gui_smoke.ps1'
      - 'tests/v020_multiformat_search_smoke.ps1'
      - 'tests/Prepare-Windows-Field-QA.ps1'
      - 'docs/RELEASE_NOTES_*'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'llm/**'
      - 'distribution/Build-Client-Package.ps1'
      - 'distribution/Build-Admin-Package.ps1'
      - 'distribution/Set-Exe-Icon.ps1'
      - 'distribution/templates/Verify-AIHelp.ps1'
      - 'assets/**'
      - 'distribution/builder_entry.py'
      - '.github/workflows/t12-windows-guis.yml'
      - 'tests/v020_client_gui_smoke.ps1'
      - 'tests/v020_client_engine_gui_smoke.ps1'
      - 'tests/v020_multiformat_search_smoke.ps1'
      - 'tests/Prepare-Windows-Field-QA.ps1'
      - 'docs/RELEASE_NOTES_*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  gui-build:
    name: Compile independent Admin and Client WPF applications
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check authoring document add replace delete
        run: dotnet run --project apps/AdminDocumentSmoke/AdminDocumentSmoke.csproj -c Release --nologo
      - name: Build administrator UI
        run: dotnet build apps/Admin/DKKnowledgeAdmin.csproj -c Release --nologo
      - name: Publish administrator UI for authoring PCs
        shell: pwsh
        run: |
          dotnet publish apps/Admin/DKKnowledgeAdmin.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\\admin-gui
          if ($LASTEXITCODE -ne 0) { throw 'Admin publishing failed' }
          if (-not (Test-Path '.\\admin-gui\\DK-Knowledge-Admin.exe')) { throw 'Missing Admin EXE' }
      - name: Build client UI
        run: dotnet build apps/Client/DKKnowledgeClient.csproj -c Release --nologo
      - name: Publish self-contained client GUI only
        shell: pwsh
        run: |
          dotnet publish apps/Client/DKKnowledgeClient.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o .\client-gui
          if ($LASTEXITCODE -ne 0) { throw 'Client publishing failed' }
          if (-not (Test-Path '.\client-gui\DK-Knowledge-Client.exe')) { throw 'Missing Client EXE' }
          foreach ($required in @('coreclr.dll','hostfxr.dll','PresentationFramework.dll','DK-Knowledge-Client.deps.json','DK-Knowledge-Client.runtimeconfig.json')) {
            if (-not (Test-Path (Join-Path '.\client-gui' $required))) { throw "Missing Client runtime: $required" }
          }
          if (Get-ChildItem '.\client-gui' -Recurse -File | Where-Object { $_.Name -match 'Admin|Builder' }) {
            throw 'Admin or Builder content leaked into client GUI output'
          }
      - name: Verify multi-file EXE icon replacement and startup
        shell: pwsh
        run: |
          foreach ($kind in @('admin','client')) {
            $ico = Join-Path '.\assets\generated' ($kind + '.ico')
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $ico).Path)
            if ($bytes.Length -lt 256 -or [BitConverter]::ToUInt16($bytes,4) -ne 4) { throw "Invalid ICO: $kind" }
          }
          $work = Join-Path $env:RUNNER_TEMP 'multi-file-icon-test'
          $original = Join-Path $work 'baseline'
          $modified = Join-Path $work 'patched'
          foreach ($folder in @($original,$modified)) {
            New-Item -ItemType Directory -Path $folder -Force | Out-Null
            Copy-Item -Path '.\client-gui\*' -Destination $folder -Recurse -Force
            New-Item -ItemType Directory -Path (Join-Path $folder 'assets'),(Join-Path $folder 'config') -Force | Out-Null
            Copy-Item -LiteralPath '.\assets\generated\admin.ico' -Destination (Join-Path $folder 'assets\app.ico')
            [IO.File]::WriteAllText((Join-Path $folder 'package-info.json'),
              '{"product_id":"example-program","product_name":"Example","product_version":"1.0.0","app_name":"Icon Startup Test","icon_file":"assets/app.ico"}')
            [IO.File]::WriteAllText((Join-Path $folder 'config\settings.json'), '{"port":8765}')
          }
          $src = Join-Path $original 'DK-Knowledge-Client.exe'
          $exe = Join-Path $modified 'DK-Knowledge-Client.exe'
          $oldHash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\distribution\Set-Exe-Icon.ps1' -Exe $exe -Icon '.\assets\generated\admin.ico'
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash -eq $oldHash) {
            throw 'Client EXE icon was not modified'
          }
          Add-Type -AssemblyName System.Drawing
          $before = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path $src).Path)
          $after = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path $exe).Path)
          if ($null -eq $before -or $null -eq $after) { throw 'Windows EXE icons are missing' }
          try {
            $img1=$before.ToBitmap(); $img2=$after.ToBitmap()
            try {
              $a=Join-Path $work 'before.png'; $b=Join-Path $work 'after.png'
              $img1.Save($a, [System.Drawing.Imaging.ImageFormat]::Png)
              $img2.Save($b, [System.Drawing.Imaging.ImageFormat]::Png)
              if ((Get-FileHash $a -Algorithm SHA256).Hash -eq (Get-FileHash $b -Algorithm SHA256).Hash) {
                throw 'Windows shell icon was not changed'
              }
            } finally { $img1.Dispose(); $img2.Dispose() }
          } finally { $before.Dispose(); $after.Dispose() }
          foreach ($folder in @($original,$modified)) {
            $app=Start-Process -FilePath (Join-Path $folder 'DK-Knowledge-Client.exe') -WorkingDirectory $folder -PassThru
            try {
              Start-Sleep -Seconds 4
              if ($app.HasExited) { throw "Client terminated at startup in $folder with exit code $($app.ExitCode)" }
            } finally {
              if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
              $app.Dispose()
            }
          }
          Write-Output 'V020_MULTIFILE_BRANDED_GUI_STARTUP_OK'
      - name: Smoke actual WPF port change, API endpoint and close-to-tray
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\tests\v020_client_gui_smoke.ps1' -PublishedClient '.\client-gui'
          if ($LASTEXITCODE -ne 0) { throw 'v0.2 GUI field automation failed' }
      - name: Parse client packaging PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\distribution\Build-Client-Package.ps1').Path,
            [ref]$tokens, [ref]$errors
          )
          if ($errors.Count -gt 0) { throw ($errors -join '; ') }
      - name: Parse Windows field QA preparation script in Windows PowerShell 5.1
        shell: pwsh
        run: |
          # The target environment is Windows PowerShell 5.1, not pwsh 7.
          # 5.1 reads scripts without a UTF-8 BOM as the system ANSI codepage.
          $file = (Resolve-Path '.\tests\Prepare-Windows-Field-QA.ps1').Path
          $bytes = [System.IO.File]::ReadAllBytes($file)
          if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
            throw 'Windows PowerShell 5.1 requires a UTF-8 BOM for the Korean QA script'
          }
          & powershell.exe -NoProfile -Command '$tokens=$null; $errors=$null; [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ".\tests\Prepare-Windows-Field-QA.ps1").Path,[ref]$tokens,[ref]$errors); if($errors.Count){throw ($errors -join "; ")}; Write-Output "V020_FIELD_QA_PS51_SYNTAX_OK"'
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 QA script syntax check failed' }
      - name: Upload administrator GUI for authoring PC (never included in Client ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: DK-Knowledge-Admin-GUI-test
          path: admin-gui/DK-Knowledge-Admin.exe
          if-no-files-found: error
          retention-days: 7
      - name: Upload full multi-file Client GUI test payload (not an integrated release)
        uses: actions/upload-artifact@v4
        with:
          name: DK-Knowledge-Client-GUI-test
          path: client-gui/
          if-no-files-found: error
          retention-days: 7

  engine-base:
    name: Build verified Windows engine base for Client package
    uses: ./.github/workflows/t07-portable-windows.yml

  client-package:
    name: Assemble and verify Client-only integrated ZIP
    needs: [gui-build, engine-base]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: DK-Knowledge-Engine-Win-x64-demo-T07
          path: ./base-zip
      - name: Extract source engine ZIP
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath '.\base-zip\DK-Knowledge-Engine-Win-x64.zip' -DestinationPath '.\base-extracted'
      - name: Assemble isolated Client package using validated sample DB
        shell: pwsh
        run: |
          $base = (Resolve-Path '.\base-extracted\DK-Knowledge-Engine-Win-x64').Path
          $db = Join-Path $base 'knowledge\knowledge.db'
          # The client-package job only publishes Client; Admin's default
          # icon is not generated implicitly in this independent Windows job.
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\assets\Generate-Icon.ps1' -Kind admin -Output '.\assets\generated\admin.ico'
          if ($LASTEXITCODE -ne 0) { throw 'Custom test ICO creation failed' }
          # Inject unlisted authoring files to prove they are never shipped.
          Set-Content -LiteralPath (Join-Path $base 'DK-Knowledge-Admin.exe') -Value 'test-only sentinel'
          New-Item -ItemType Directory -Path (Join-Path $base 'builder') | Out-Null
          Set-Content -LiteralPath (Join-Path $base 'builder/private-notes.txt') -Value 'must not ship'
          # A separate source-package API is allowed to keep running during
          # first-time assembly of a NEW Client package; it is never updated.
          $unrelatedApi = Start-Process -FilePath (Join-Path $base 'engine\DK-Knowledge-API.exe') -WorkingDirectory $base -PassThru
          try {
            Start-Sleep -Seconds 2
            if ($unrelatedApi.HasExited) { throw 'Unrelated test API exited before Client assembly' }
            & .\distribution\Build-Client-Package.ps1 -EnginePackage $base -KnowledgeDb $db -OutputDir '.\client-package-output' -ProductId 'example-program' -ProductName 'Example Program' -ProductVersion '2.0.0' -AppName 'Example Help Client' -IconFile '.\assets\generated\admin.ico'
            if ($LASTEXITCODE -ne 0) { throw 'Client package assembly failed' }
            if ($unrelatedApi.HasExited) { throw 'Client package creation interrupted the unrelated API' }
          }
          finally {
            if (-not $unrelatedApi.HasExited) {
              Stop-Process -Id $unrelatedApi.Id -ErrorAction Stop
              $unrelatedApi.WaitForExit()
            }
            $unrelatedApi.Dispose()
          }
          $package = '.\client-package-output\DK-Knowledge-Engine-Client'
          if (-not (Test-Path (Join-Path $package 'DK-Knowledge-Client.exe'))) { throw 'Client EXE missing' }
          $identity = Get-Content -LiteralPath (Join-Path $package 'package-info.json') -Raw | ConvertFrom-Json
          if ($identity.product_id -ne 'example-program' -or $identity.product_version -ne '2.0.0' -or $identity.app_name -ne 'Example Help Client') {
            throw 'Client product identity is missing or incorrect'
          }
          $clientManifest = Get-Content -LiteralPath (Join-Path $package 'manifest.json') -Raw | ConvertFrom-Json
          foreach ($runtime in @('coreclr.dll','hostfxr.dll','PresentationFramework.dll',
            'DK-Knowledge-Client.deps.json','DK-Knowledge-Client.runtimeconfig.json')) {
            $file = Join-Path $package $runtime
            if (-not (Test-Path -LiteralPath $file -PathType Leaf) -or
                -not $clientManifest.immutable_files.PSObject.Properties[$runtime]) {
              throw "Client dependency missing/untracked: $runtime"
            }
            if ($clientManifest.immutable_files.PSObject.Properties[$runtime].Value -ne
                (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()) {
              throw "Client dependency hash incorrect: $runtime"
            }
          }
          if ((Get-FileHash '.\assets\generated\admin.ico' -Algorithm SHA256).Hash -ne
              (Get-FileHash (Join-Path $package 'assets\app.ico') -Algorithm SHA256).Hash) {
            throw 'Selected Client ICO not present in ZIP'
          }
          $scoped = & (Join-Path $package 'engine\DK-Knowledge-API.exe') --verify-db (Join-Path $package 'knowledge\knowledge.db') --verify-product-id 'example-program' | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $scoped.documents -lt 1) { throw 'Client DB is not product-scoped' }

          if (Test-Path (Join-Path $package 'DK-Knowledge-Admin.exe')) { throw 'Admin EXE shipped' }
          if (Test-Path (Join-Path $package 'builder')) { throw 'Builder shipped' }
          foreach ($item in @('README.md','LICENSE','THIRD_PARTY_NOTICES.md')) {
            if (-not (Test-Path (Join-Path $package $item))) { throw "Missing Client notice: $item" }
          }
          foreach ($item in @(
            'NET_RUNTIME_LICENSE.txt', 'NET_RUNTIME_THIRD-PARTY-NOTICES.txt',
            'WPF_LICENSE.txt', 'WPF_THIRD-PARTY-NOTICES.txt',
            'WINDOWS_LICENSE_INFORMATION.md', 'NET_LIBRARY_LICENSE.html',
            'WINDOWS_SDK_LICENSE.html'
          )) {
            $file = Join-Path $package ('licenses\dotnet\' + $item)
            if (-not (Test-Path -LiteralPath $file -PathType Leaf) -or (Get-Item $file).Length -lt 500) {
              throw "Client missing Microsoft redistributable notice: $file"
            }
          }
          Write-Output 'T24_CLIENT_DOTNET_NOTICES_INCLUDED'
          if (Test-Path (Join-Path $package 'knowledge/knowledge.previous.db')) { throw 'Previous source DB leaked into Client ZIP' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $package 'Verify-AIHelp.ps1') -Root $package
          if ($LASTEXITCODE -ne 0) { throw 'Client package verification failed' }
          # Reusing an existing output must overwrite generated files but keep
          # unrelated authoring files and must not include them in the ZIP.
          $note = Join-Path '.\client-package-output' 'keep-local.txt'
          Set-Content -LiteralPath $note -Value 'author-notes'
          # Select an alternate-name GGUF from the authoring PC. Use the
          # identical verified Qwen3 model bytes to test packaging without
          # claiming a different architecture is compatible.
          $selected = Join-Path $base 'models\selected-test.gguf'
          Copy-Item -LiteralPath (Join-Path $base 'models\Qwen3-1.7B-Q4_K_M.gguf') -Destination $selected
          & .\distribution\Build-Client-Package.ps1 -EnginePackage $base -KnowledgeDb $db -OutputDir '.\client-package-output' -ModelFile $selected -PromptMode 'jinja' -ProductId 'example-program' -ProductName 'Example Program' -ProductVersion '2.0.0' -IconFile '.\assets\generated\admin.ico' -AppName 'Example Help Client'
          if ($LASTEXITCODE -ne 0) { throw 'Repeated build with selected model failed' }
          $generated = '.\client-package-output\DK-Knowledge-Engine-Client'
          $modelConfig = Get-Content (Join-Path $generated 'config\settings.json') -Raw | ConvertFrom-Json
          if ($modelConfig.model.file -ne 'models/selected-test.gguf' -or $modelConfig.model.prompt_mode -ne 'jinja') {
            throw 'Selected model or prompt mode not written into client configuration'
          }
          $models = @(Get-ChildItem (Join-Path $generated 'models') -Filter '*.gguf' -File)
          if ($models.Count -ne 1 -or $models[0].Name -ne 'selected-test.gguf') {
            throw 'Client package did not replace default GGUF with selected model'
          }
          $manifest = Get-Content (Join-Path $generated 'manifest.json') -Raw | ConvertFrom-Json
          $expectedHash = (Get-FileHash $models[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifest.model_sha256 -ne $expectedHash -or
              $manifest.immutable_files.'models/selected-test.gguf' -ne $expectedHash) {
            throw 'Selected model SHA-256 was not recorded in manifest'
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $generated 'Verify-AIHelp.ps1') -Root $generated
          if ($LASTEXITCODE -ne 0) { throw 'Selected model Client integrity verification failed' }
          $finalProduct = Get-Content -LiteralPath (Join-Path $generated 'package-info.json') -Raw | ConvertFrom-Json
          if ($finalProduct.app_name -ne 'Example Help Client') {
            throw 'Branded Client app name was not retained in final ZIP'
          }
          $brandedIconHash = (Get-FileHash '.\assets\generated\admin.ico' -Algorithm SHA256).Hash
          $finalIconHash = (Get-FileHash (Join-Path $generated 'assets\app.ico') -Algorithm SHA256).Hash
          if ($brandedIconHash -ne $finalIconHash) {
            throw 'Final Client ZIP did not retain the selected custom icon'
          }
          if ((Get-Content -LiteralPath $note -Raw).Trim() -ne 'author-notes') { throw 'Unrelated output file was lost' }
          $zip = '.\client-package-output\DK-Knowledge-Engine-Client-Win-x64.zip'
          $zipContents = & tar.exe -tf $zip
          if ($zipContents -match 'keep-local.txt') { throw 'Unrelated local file leaked into Client ZIP' }
          # Startup of the fully assembled Client, not only dotnet publish.
          $exe = (Resolve-Path (Join-Path $generated 'DK-Knowledge-Client.exe')).Path
          $app = Start-Process -FilePath $exe -WorkingDirectory (Resolve-Path $generated).Path -PassThru
          try {
            Start-Sleep -Seconds 4
            if ($app.HasExited) { throw "Generated Client terminated (exit $($app.ExitCode))" }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
            $app.Dispose()
          }
          Write-Output 'T12_CLIENT_ONLY_MULTIFILE_PACKAGE_OK'
      - name: Reject altered Client runtime DLL and restore valid package
        shell: pwsh
        run: |
          $package = (Resolve-Path '.\client-package-output\DK-Knowledge-Engine-Client').Path
          $dll = (Resolve-Path (Join-Path $package 'coreclr.dll')).Path
          $before = (Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash
          # The manifest must reject changed app-host runtime bytes, even if all
          # other files, product metadata, and knowledge DB are intact.
          $stream = [IO.File]::Open($dll, [IO.FileMode]::Open, [IO.FileAccess]::ReadWrite)
          try {
            $first = $stream.ReadByte()
            if ($first -lt 0) { throw 'Empty runtime DLL' }
            $stream.Position = 0
            $stream.WriteByte([byte]($first -bxor 1))
          } finally { $stream.Dispose() }
          try {
            $verify = Join-Path $package 'Verify-AIHelp.ps1'
            $out = Join-Path $env:RUNNER_TEMP 'tampered-verify.stdout.txt'
            $err = Join-Path $env:RUNNER_TEMP 'tampered-verify.stderr.txt'
            $check = Start-Process -FilePath 'powershell.exe' -ArgumentList @(
              '-NoProfile','-ExecutionPolicy','Bypass','-File',
              ('"' + $verify + '"'),'-Root',('"' + $package + '"')
            ) -Wait -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
            if ($check.ExitCode -eq 0) { throw 'Tampered Client runtime was mistakenly accepted' }
            $failure = Get-Content -LiteralPath $err -Raw
            if ($failure -notmatch 'Package SHA-256 mismatch: coreclr.dll') {
              throw 'Runtime tampering was rejected for an unexpected reason'
            }
          } finally {
            $stream = [IO.File]::Open($dll, [IO.FileMode]::Open, [IO.FileAccess]::ReadWrite)
            try {
              $stream.Position = 0
              $stream.WriteByte([byte]$first)
            } finally { $stream.Dispose() }
          }
          if ((Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash -ne $before) {
            throw 'Runtime DLL could not be restored byte-for-byte'
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $package 'Verify-AIHelp.ps1') -Root $package
          if ($LASTEXITCODE -ne 0) { throw 'Restored Client failed normal verification' }
          Write-Output 'T12_CLIENT_RUNTIME_TAMPER_REJECTED'
      - name: Upload client-only integrated trial ZIP (not a Release)
        uses: actions/upload-artifact@v4
        with:
          name: DK-Knowledge-Engine-Client-Win-x64-T12
          path: client-package-output/DK-Knowledge-Engine-Client-Win-x64.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Exercise packaged Client GUI engine lifecycle, DB apply and rollback
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\tests\v020_client_engine_gui_smoke.ps1' -PackageRoot '.\client-package-output\DK-Knowledge-Engine-Client'
          if ($LASTEXITCODE -ne 0) { throw 'Client GUI engine and knowledge maintenance smoke failed' }
      - name: Confirm optional semantic package and default lightweight package are isolated
        shell: pwsh
        env:
          PYTHONPATH: .
        run: |
          $base = (Resolve-Path '.\base-extracted\DK-Knowledge-Engine-Win-x64').Path
          $normal = '.\client-package-output\DK-Knowledge-Engine-Client'
          if (Test-Path (Join-Path $normal 'runtime\llama-embedding.exe')) {
            throw 'Default Client unexpectedly includes embedding runtime'
          }
          $fakeModel = Join-Path $env:RUNNER_TEMP 'test-only-encoder.gguf'
          [IO.File]::WriteAllBytes($fakeModel, [byte[]](1,2,3,4,5,6,7,8))
          $syntheticDb = Join-Path $env:RUNNER_TEMP 't19-fixture.db'
          python tests/t19_prepare_vector_fixture.py --database (Join-Path $base 'knowledge\knowledge.db') --output $syntheticDb --model $fakeModel
          if ($LASTEXITCODE -ne 0) { throw 'T19 synthetic DB fixture creation failed' }
          $authorHash = (Get-FileHash -LiteralPath $syntheticDb -Algorithm SHA256).Hash
          # Building a default Client from an author DB containing vectors must
          # strip only its packaged DB copy, not the author DB or original chunks.
          & .\distribution\Build-Client-Package.ps1 -EnginePackage $base -KnowledgeDb $syntheticDb -OutputDir '.\lightweight-vector-output' -ProductId 'example-program' -ProductName 'Example Program' -ProductVersion '2.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'Vector-free default package build failed' }
          $light = '.\lightweight-vector-output\DK-Knowledge-Engine-Client'
          $compactDb = Join-Path $light 'knowledge\knowledge.db'
          $compactInfo = & (Join-Path $light 'engine\DK-Knowledge-API.exe') --verify-db $compactDb | ConvertFrom-Json
          $originalInfo = & (Join-Path $base 'engine\DK-Knowledge-API.exe') --verify-db $syntheticDb | ConvertFrom-Json
          if ($compactInfo.embedding -or -not $originalInfo.embedding.complete) {
            throw 'Default Client did not strip only the copied vectors'
          }
          if ((Get-Item $compactDb).Length -ge (Get-Item $syntheticDb).Length) {
            throw 'Default Client knowledge DB was not compacted'
          }
          if ((Get-FileHash -LiteralPath $syntheticDb -Algorithm SHA256).Hash -ne $authorHash) {
            throw 'Original author knowledge DB changed while packaging'
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $light 'Verify-AIHelp.ps1') -Root $light
          if ($LASTEXITCODE -ne 0) { throw 'Compacted Client integrity check failed' }
          Write-Output 'T22_VECTOR_FREE_CLIENT_COPY_OK'
          & .\distribution\Build-Client-Package.ps1 -EnginePackage $base -KnowledgeDb $syntheticDb -OutputDir '.\semantic-test-output' -EmbeddingModelFile $fakeModel -ProductId 'example-program' -ProductName 'Example Program' -ProductVersion '2.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'Optional semantic package creation failed' }
          $semantic = '.\semantic-test-output\DK-Knowledge-Engine-Client'
          if (-not (Test-Path (Join-Path $semantic 'runtime\llama-embedding.exe'))) {
            throw 'Semantic Client is missing its embedding runtime'
          }
          if (-not (Test-Path (Join-Path $semantic 'models\test-only-encoder.gguf'))) {
            throw 'Semantic Client is missing its selected encoder'
          }
          $settings = Get-Content -LiteralPath (Join-Path $semantic 'config\settings.json') -Raw | ConvertFrom-Json
          if ($settings.embedding.file -ne 'models/test-only-encoder.gguf') { throw 'Embedding setting missing' }
          $expected = (Get-FileHash -LiteralPath $fakeModel -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = Get-Content -LiteralPath (Join-Path $semantic 'manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.embedding_model_sha256 -ne $expected -or
              $manifest.immutable_files.'models/test-only-encoder.gguf' -ne $expected) {
            throw 'Embedding checksum not included in Client manifest'
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $semantic 'Verify-AIHelp.ps1') -Root $semantic
          if ($LASTEXITCODE -ne 0) { throw 'Optional semantic package integrity check failed' }
          Write-Output 'T19_SYNTHETIC_SEMANTIC_PACKAGE_OK'
          # Test-only fake model is never published as a release artifact.

  admin-package:
    name: Build and verify standalone Admin ZIP without target Python or SDK
    needs: [gui-build, engine-base]
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packaging and synthetic document test tools
        shell: pwsh
        run: |
          python -m pip install -r requirements-builder.txt
          python -m pip install pyinstaller==6.22.3 reportlab
          if ($LASTEXITCODE -ne 0) { throw 'Packaging dependencies failed' }
      - uses: actions/download-artifact@v4
        with:
          name: DK-Knowledge-Engine-Win-x64-demo-T07
          path: ./admin-engine-base
      - name: Build independent Admin ZIP
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath '.\admin-engine-base\DK-Knowledge-Engine-Win-x64.zip' -DestinationPath '.\admin-engine-extract'
          $engine = (Resolve-Path '.\admin-engine-extract\DK-Knowledge-Engine-Win-x64').Path
          & .\distribution\Build-Admin-Package.ps1 -EnginePackage $engine -OutputDir '.\admin-package-output'
          if ($LASTEXITCODE -ne 0) { throw 'Standalone Admin ZIP creation failed' }
      - name: Fresh extraction and Builder PDF DOCX TXT MD smoke without target Python or SDK
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath '.\admin-package-output\DK-Knowledge-Engine-Admin-Win-x64.zip' -DestinationPath '.\admin-extracted'
          $admin = (Resolve-Path '.\admin-extracted\DK-Knowledge-Engine-Admin').Path
          $manuals = Join-Path $admin 'workspace\sources\manual-test\manuals'
          New-Item -ItemType Directory -Path $manuals -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $manuals 'guide.md') -Value '# Manual - instructions' -Encoding UTF8
          Set-Content -LiteralPath (Join-Path $manuals 'notes.txt') -Value 'Configuration help' -Encoding UTF8
          $env:ADMIN_DOC_DIR = $manuals
          @'
          import os
          from pathlib import Path
          from docx import Document
          from reportlab.pdfgen import canvas
          root = Path(os.environ["ADMIN_DOC_DIR"])
          d = Document()
          d.add_paragraph("DOCX setup instruction")
          d.save(root / "setup.docx")
          pdf = canvas.Canvas(str(root / "setup.pdf"))
          pdf.drawString(72, 750, "PDF setup instruction")
          pdf.save()
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Fixture generation failed' }

          # The authoring workstation has no Python or .NET SDK in PATH.
          $previousPath = $env:PATH
          $env:PATH = "$env:SystemRoot\System32\WindowsPowerShell\v1.0;$env:SystemRoot\System32;$env:SystemRoot"
          try {
            $builder = Join-Path $admin 'tools\builder\DK-Knowledge-Builder.exe'
            if (-not (Test-Path -LiteralPath $builder)) { throw 'Missing standalone Builder' }
            $db = Join-Path $admin 'workspace\knowledge.db'
            & $builder --source (Join-Path $admin 'workspace\sources') --database $db --rebuild
            if ($LASTEXITCODE -ne 0) { throw 'Standalone Builder failed to extract documents' }
            $ps = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
            $script = Join-Path $admin 'tools\Build-Client-Package.ps1'
            $engine = Join-Path $admin 'engine-template'
            $clientGui = Join-Path $admin 'client\DK-Knowledge-Client.exe'
            foreach ($runtime in @('coreclr.dll','hostfxr.dll','PresentationFramework.dll',
              'DK-Knowledge-Client.deps.json','DK-Knowledge-Client.runtimeconfig.json')) {
              if (-not (Test-Path -LiteralPath (Join-Path $admin ('client\' + $runtime)) -PathType Leaf)) {
                throw "SDK-free Admin has no Client dependency: $runtime"
              }
            }
            foreach ($item in @('README.md','LICENSE','THIRD_PARTY_NOTICES.md','docs/CLIENT_QUICKSTART.md')) {
              if (-not (Test-Path (Join-Path $admin $item))) { throw "Missing Admin notice: $item" }
            }
            foreach ($item in @(
              'NET_RUNTIME_LICENSE.txt', 'NET_RUNTIME_THIRD-PARTY-NOTICES.txt',
              'WPF_LICENSE.txt', 'WPF_THIRD-PARTY-NOTICES.txt',
              'WINDOWS_LICENSE_INFORMATION.md', 'NET_LIBRARY_LICENSE.html',
              'WINDOWS_SDK_LICENSE.html'
            )) {
              $file = Join-Path $admin ('licenses\dotnet\' + $item)
              if (-not (Test-Path -LiteralPath $file -PathType Leaf) -or (Get-Item $file).Length -lt 500) {
                throw "Admin missing Microsoft redistributable notice: $file"
              }
            }
            Write-Output 'T24_ADMIN_DOTNET_NOTICES_INCLUDED'
            $licenses = Join-Path $admin 'licenses\builder'
            foreach ($dependency in @('pypdf', 'python-docx', 'lxml', 'typing_extensions')) {
              $folder = @(Get-ChildItem -LiteralPath $licenses -Directory | Where-Object {
                $_.Name.StartsWith($dependency + '-')
              })
              if ($folder.Count -ne 1) { throw "Builder license folder missing: $dependency" }
              $texts = @(Get-ChildItem -LiteralPath $folder[0].FullName -File | Where-Object {
                $_.Name -match '^(license|copying|notice)'
              })
              if ($texts.Count -lt 1) { throw "Builder license text missing: $dependency" }
            }
            Write-Output 'T23_BUILDER_LICENSE_TEXTS_INCLUDED'
            & $ps -NoProfile -ExecutionPolicy Bypass -File $script -EnginePackage $engine -KnowledgeDb $db -ClientExe $clientGui -OutputDir '.\t13-generated-client' -ProductId 'manual-test' -ProductName 'Standalone Example' -ProductVersion '1.0.0' -IconFile (Join-Path $admin 'assets\admin.ico') -AppName 'Offline Branded Help'
            if ($LASTEXITCODE -ne 0) { throw 'Standalone Admin failed to make Client package' }
            $client = '.\t13-generated-client\DK-Knowledge-Engine-Client'
            if (Test-Path (Join-Path $client 'DK-Knowledge-Admin.exe')) { throw 'Admin EXE leaked to Client' }
            $product = Get-Content -LiteralPath (Join-Path $client 'package-info.json') -Raw | ConvertFrom-Json
            if ($product.app_name -ne 'Offline Branded Help') { throw 'Standalone Client app name not saved' }
            if ((Get-FileHash (Join-Path $client 'assets\app.ico') -Algorithm SHA256).Hash -ne
                (Get-FileHash (Join-Path $admin 'assets\admin.ico') -Algorithm SHA256).Hash) {
              throw 'Standalone Client selected icon was not applied'
            }
            $manifest = Get-Content -LiteralPath (Join-Path $client 'manifest.json') -Raw | ConvertFrom-Json
            foreach ($runtime in @('coreclr.dll','hostfxr.dll','PresentationFramework.dll',
              'DK-Knowledge-Client.deps.json','DK-Knowledge-Client.runtimeconfig.json')) {
              if (-not (Test-Path -LiteralPath (Join-Path $client $runtime) -PathType Leaf) -or
                  -not $manifest.immutable_files.PSObject.Properties[$runtime]) {
                throw "Standalone Client dependency missing/untracked: $runtime"
              }
            }
            foreach ($name in @('NET_LIBRARY_LICENSE.html','WINDOWS_SDK_LICENSE.html','NET_RUNTIME_THIRD-PARTY-NOTICES.txt')) {
              $adminNotice = Join-Path $admin ('licenses\dotnet\' + $name)
              $clientNotice = Join-Path $client ('licenses\dotnet\' + $name)
              if (-not (Test-Path -LiteralPath $clientNotice -PathType Leaf) -or
                  (Get-FileHash $clientNotice -Algorithm SHA256).Hash -ne
                  (Get-FileHash $adminNotice -Algorithm SHA256).Hash) {
                throw "Offline Client did not preserve Admin Microsoft legal notice: $name"
              }
            }
            Write-Output 'T24_OFFLINE_ADMIN_CLIENT_NOTICE_COPY_OK'
            if (Test-Path (Join-Path $client 'builder')) { throw 'Builder leaked to Client' }
            & $ps -NoProfile -ExecutionPolicy Bypass -File (Join-Path $client 'Verify-AIHelp.ps1') -Root $client
            if ($LASTEXITCODE -ne 0) { throw 'Generated Client package failed verification' }
          }
          finally {
            $env:PATH = $previousPath
          }
          Write-Output 'T13_STANDALONE_ADMIN_CLIENT_PACKAGE_OK'
      - name: Verify real offline Client search and sources for PDF DOCX TXT and MD
        shell: pwsh
        run: |
          # PowerShell script throws on failures; it does not set LASTEXITCODE.
          & .\tests\v020_multiformat_search_smoke.ps1 -ClientRoot '.\t13-generated-client\DK-Knowledge-Engine-Client'
      - name: Upload standalone authoring workstation ZIP (not Release)
        uses: actions/upload-artifact@v4
        with:
          name: DK-Knowledge-Engine-Admin-Win-x64-T13
          path: admin-package-output/DK-Knowledge-Engine-Admin-Win-x64.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

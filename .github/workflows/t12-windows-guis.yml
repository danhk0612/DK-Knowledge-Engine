name: T12 separated Admin and Client Windows GUIs

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'distribution/Build-Client-Package.ps1'
      - 'distribution/Build-Admin-Package.ps1'
      - 'distribution/builder_entry.py'
      - '.github/workflows/t12-windows-guis.yml'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'distribution/Build-Client-Package.ps1'
      - 'distribution/Build-Admin-Package.ps1'
      - 'distribution/builder_entry.py'
      - '.github/workflows/t12-windows-guis.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  gui-build:
    name: Compile independent Admin and Client WPF applications
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check authoring document add replace delete
        run: dotnet run --project apps/AdminDocumentSmoke/AdminDocumentSmoke.csproj -c Release --nologo
      - name: Build administrator UI
        run: dotnet build apps/Admin/DKKnowledgeAdmin.csproj -c Release --nologo
      - name: Publish administrator UI for authoring PCs
        shell: pwsh
        run: |
          dotnet publish apps/Admin/DKKnowledgeAdmin.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\\admin-gui
          if ($LASTEXITCODE -ne 0) { throw 'Admin publishing failed' }
          if (-not (Test-Path '.\\admin-gui\\DK-Knowledge-Admin.exe')) { throw 'Missing Admin EXE' }
      - name: Build client UI
        run: dotnet build apps/Client/DKKnowledgeClient.csproj -c Release --nologo
      - name: Publish self-contained client GUI only
        shell: pwsh
        run: |
          dotnet publish apps/Client/DKKnowledgeClient.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\client-gui
          if ($LASTEXITCODE -ne 0) { throw 'Client publishing failed' }
          if (-not (Test-Path '.\client-gui\DK-Knowledge-Client.exe')) { throw 'Missing Client EXE' }
          if (Get-ChildItem '.\client-gui' -Recurse -File | Where-Object { $_.Name -match 'Admin|Builder' }) {
            throw 'Admin or Builder content leaked into client GUI output'
          }
      - name: Parse client packaging PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\distribution\Build-Client-Package.ps1').Path,
            [ref]$tokens, [ref]$errors
          )
          if ($errors.Count -gt 0) { throw ($errors -join '; ') }
      - name: Upload administrator GUI for authoring PC (never included in Client ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: DK-Knowledge-Admin-GUI-test
          path: admin-gui/DK-Knowledge-Admin.exe
          if-no-files-found: error
          retention-days: 7
      - name: Upload standalone GUI test executable (not an integrated release)
        uses: actions/upload-artifact@v4
        with:
          name: DK-Knowledge-Client-GUI-test
          path: client-gui/DK-Knowledge-Client.exe
          if-no-files-found: error
          retention-days: 7

  engine-base:
    name: Build verified Windows engine base for Client package
    uses: ./.github/workflows/t07-portable-windows.yml

  client-package:
    name: Assemble and verify Client-only integrated ZIP
    needs: [gui-build, engine-base]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: DK-Knowledge-Engine-Win-x64-demo-T07
          path: ./base-zip
      - name: Extract source engine ZIP
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath '.\base-zip\DK-Knowledge-Engine-Win-x64.zip' -DestinationPath '.\base-extracted'
      - name: Assemble isolated Client package using validated sample DB
        shell: pwsh
        run: |
          $base = (Resolve-Path '.\base-extracted\DK-Knowledge-Engine-Win-x64').Path
          $db = Join-Path $base 'knowledge\knowledge.db'
          # Inject unlisted authoring files to prove they are never shipped.
          Set-Content -LiteralPath (Join-Path $base 'DK-Knowledge-Admin.exe') -Value 'test-only sentinel'
          New-Item -ItemType Directory -Path (Join-Path $base 'builder') | Out-Null
          Set-Content -LiteralPath (Join-Path $base 'builder/private-notes.txt') -Value 'must not ship'
          # A separate source-package API is allowed to keep running during
          # first-time assembly of a NEW Client package; it is never updated.
          $unrelatedApi = Start-Process -FilePath (Join-Path $base 'engine\DK-Knowledge-API.exe') -WorkingDirectory $base -PassThru
          try {
            Start-Sleep -Seconds 2
            if ($unrelatedApi.HasExited) { throw 'Unrelated test API exited before Client assembly' }
            & .\distribution\Build-Client-Package.ps1 -EnginePackage $base -KnowledgeDb $db -OutputDir '.\client-package-output'
            if ($LASTEXITCODE -ne 0) { throw 'Client package assembly failed' }
            if ($unrelatedApi.HasExited) { throw 'Client package creation interrupted the unrelated API' }
          }
          finally {
            if (-not $unrelatedApi.HasExited) {
              Stop-Process -Id $unrelatedApi.Id -ErrorAction Stop
              $unrelatedApi.WaitForExit()
            }
            $unrelatedApi.Dispose()
          }
          $package = '.\client-package-output\DK-Knowledge-Engine-Client'
          if (-not (Test-Path (Join-Path $package 'DK-Knowledge-Client.exe'))) { throw 'Client EXE missing' }
          if (Test-Path (Join-Path $package 'DK-Knowledge-Admin.exe')) { throw 'Admin EXE shipped' }
          if (Test-Path (Join-Path $package 'builder')) { throw 'Builder shipped' }
          foreach ($item in @('README.md','LICENSE','THIRD_PARTY_NOTICES.md')) {
            if (-not (Test-Path (Join-Path $package $item))) { throw "Missing Client notice: $item" }
          }
          if (Test-Path (Join-Path $package 'knowledge/knowledge.previous.db')) { throw 'Previous source DB leaked into Client ZIP' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $package 'Verify-AIHelp.ps1') -Root $package
          if ($LASTEXITCODE -ne 0) { throw 'Client package verification failed' }
          # Reusing an existing output must overwrite generated files but keep
          # unrelated authoring files and must not include them in the ZIP.
          $note = Join-Path '.\client-package-output' 'keep-local.txt'
          Set-Content -LiteralPath $note -Value 'author-notes'
          # Select an alternate-name GGUF from the authoring PC. Use the
          # identical verified Qwen3 model bytes to test packaging without
          # claiming a different architecture is compatible.
          $selected = Join-Path $base 'models\selected-test.gguf'
          Copy-Item -LiteralPath (Join-Path $base 'models\Qwen3-1.7B-Q4_K_M.gguf') -Destination $selected
          & .\distribution\Build-Client-Package.ps1 -EnginePackage $base -KnowledgeDb $db -OutputDir '.\client-package-output' -ModelFile $selected -PromptMode 'jinja'
          if ($LASTEXITCODE -ne 0) { throw 'Repeated build with selected model failed' }
          $generated = '.\client-package-output\DK-Knowledge-Engine-Client'
          $modelConfig = Get-Content (Join-Path $generated 'config\settings.json') -Raw | ConvertFrom-Json
          if ($modelConfig.model.file -ne 'models/selected-test.gguf' -or $modelConfig.model.prompt_mode -ne 'jinja') {
            throw 'Selected model or prompt mode not written into client configuration'
          }
          $models = @(Get-ChildItem (Join-Path $generated 'models') -Filter '*.gguf' -File)
          if ($models.Count -ne 1 -or $models[0].Name -ne 'selected-test.gguf') {
            throw 'Client package did not replace default GGUF with selected model'
          }
          $manifest = Get-Content (Join-Path $generated 'manifest.json') -Raw | ConvertFrom-Json
          $expectedHash = (Get-FileHash $models[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifest.model_sha256 -ne $expectedHash -or
              $manifest.immutable_files.'models/selected-test.gguf' -ne $expectedHash) {
            throw 'Selected model SHA-256 was not recorded in manifest'
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $generated 'Verify-AIHelp.ps1') -Root $generated
          if ($LASTEXITCODE -ne 0) { throw 'Selected model Client integrity verification failed' }
          if ((Get-Content -LiteralPath $note -Raw).Trim() -ne 'author-notes') { throw 'Unrelated output file was lost' }
          $zip = '.\client-package-output\DK-Knowledge-Engine-Client-Win-x64.zip'
          $zipContents = & tar.exe -tf $zip
          if ($zipContents -match 'keep-local.txt') { throw 'Unrelated local file leaked into Client ZIP' }
          Write-Output 'T12_CLIENT_ONLY_PACKAGE_OK'
      - name: Upload client-only integrated trial ZIP (not a Release)
        uses: actions/upload-artifact@v4
        with:
          name: DK-Knowledge-Engine-Client-Win-x64-T12
          path: client-package-output/DK-Knowledge-Engine-Client-Win-x64.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  admin-package:
    name: Build and verify standalone Admin ZIP without target Python or SDK
    needs: [gui-build, engine-base]
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packaging and synthetic document test tools
        shell: pwsh
        run: |
          python -m pip install -r requirements-builder.txt
          python -m pip install pyinstaller==6.22.3 reportlab
          if ($LASTEXITCODE -ne 0) { throw 'Packaging dependencies failed' }
      - uses: actions/download-artifact@v4
        with:
          name: DK-Knowledge-Engine-Win-x64-demo-T07
          path: ./admin-engine-base
      - name: Build independent Admin ZIP
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath '.\admin-engine-base\DK-Knowledge-Engine-Win-x64.zip' -DestinationPath '.\admin-engine-extract'
          $engine = (Resolve-Path '.\admin-engine-extract\DK-Knowledge-Engine-Win-x64').Path
          & .\distribution\Build-Admin-Package.ps1 -EnginePackage $engine -OutputDir '.\admin-package-output'
          if ($LASTEXITCODE -ne 0) { throw 'Standalone Admin ZIP creation failed' }
      - name: Fresh extraction and Builder PDF DOCX TXT MD smoke without target Python or SDK
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath '.\admin-package-output\DK-Knowledge-Engine-Admin-Win-x64.zip' -DestinationPath '.\admin-extracted'
          $admin = (Resolve-Path '.\admin-extracted\DK-Knowledge-Engine-Admin').Path
          $manuals = Join-Path $admin 'workspace\sources\manual-test\manuals'
          New-Item -ItemType Directory -Path $manuals -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $manuals 'guide.md') -Value '# Manual - instructions' -Encoding UTF8
          Set-Content -LiteralPath (Join-Path $manuals 'notes.txt') -Value 'Configuration help' -Encoding UTF8
          $env:ADMIN_DOC_DIR = $manuals
          @'
          import os
          from pathlib import Path
          from docx import Document
          from reportlab.pdfgen import canvas
          root = Path(os.environ["ADMIN_DOC_DIR"])
          d = Document()
          d.add_paragraph("DOCX setup instruction")
          d.save(root / "setup.docx")
          pdf = canvas.Canvas(str(root / "setup.pdf"))
          pdf.drawString(72, 750, "PDF setup instruction")
          pdf.save()
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Fixture generation failed' }

          # The authoring workstation has no Python or .NET SDK in PATH.
          $previousPath = $env:PATH
          $env:PATH = "$env:SystemRoot\System32\WindowsPowerShell\v1.0;$env:SystemRoot\System32;$env:SystemRoot"
          try {
            $builder = Join-Path $admin 'tools\builder\DK-Knowledge-Builder.exe'
            if (-not (Test-Path -LiteralPath $builder)) { throw 'Missing standalone Builder' }
            $db = Join-Path $admin 'workspace\knowledge.db'
            & $builder --source (Join-Path $admin 'workspace\sources') --database $db --rebuild
            if ($LASTEXITCODE -ne 0) { throw 'Standalone Builder failed to extract documents' }
            $ps = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
            $script = Join-Path $admin 'tools\Build-Client-Package.ps1'
            $engine = Join-Path $admin 'engine-template'
            $clientGui = Join-Path $admin 'client\DK-Knowledge-Client.exe'
            foreach ($item in @('README.md','LICENSE','THIRD_PARTY_NOTICES.md','docs/CLIENT_QUICKSTART.md')) {
              if (-not (Test-Path (Join-Path $admin $item))) { throw "Missing Admin notice: $item" }
            }
            & $ps -NoProfile -ExecutionPolicy Bypass -File $script -EnginePackage $engine -KnowledgeDb $db -ClientExe $clientGui -OutputDir '.\t13-generated-client'
            if ($LASTEXITCODE -ne 0) { throw 'Standalone Admin failed to make Client package' }
            $client = '.\t13-generated-client\DK-Knowledge-Engine-Client'
            if (Test-Path (Join-Path $client 'DK-Knowledge-Admin.exe')) { throw 'Admin EXE leaked to Client' }
            if (Test-Path (Join-Path $client 'builder')) { throw 'Builder leaked to Client' }
            & $ps -NoProfile -ExecutionPolicy Bypass -File (Join-Path $client 'Verify-AIHelp.ps1') -Root $client
            if ($LASTEXITCODE -ne 0) { throw 'Generated Client package failed verification' }
          }
          finally {
            $env:PATH = $previousPath
          }
          Write-Output 'T13_STANDALONE_ADMIN_CLIENT_PACKAGE_OK'
      - name: Upload standalone authoring workstation ZIP (not Release)
        uses: actions/upload-artifact@v4
        with:
          name: DK-Knowledge-Engine-Admin-Win-x64-T13
          path: admin-package-output/DK-Knowledge-Engine-Admin-Win-x64.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

name: T08 Windows field verification script

on:
  pull_request:
    paths:
      - 'tests/t08_field_check.ps1'
      - 'tests/t08_field_cases_sample.json'
      - '.github/workflows/t08-field-validation.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  reject-invalid-field-cases:
    name: PowerShell 5.1 rejects blank or invalid chat expectation types
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test invalid chat expectations do not silently pass
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 't08-invalid-cases'
          $package = Join-Path $work 'dummy-package'
          New-Item -ItemType Directory -Force -Path (Join-Path $package 'engine'), (Join-Path $package 'config') | Out-Null
          New-Item -ItemType File -Force -Path (Join-Path $package 'engine/DK-Knowledge-API.exe'), (Join-Path $package 'Verify-AIHelp.ps1') | Out-Null
          $ps51 = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          $scriptPath = Join-Path $PWD 'tests/t08_field_check.ps1'
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Join-Path $package 'config/settings.json'), '{"port":8765}', $utf8)
          foreach ($case in @(
            @{ name = 'empty'; expected_any = @('') },
            @{ name = 'whitespace'; expected_any = @('   ') },
            @{ name = 'scalar'; expected_any = '3308' },
            @{ name = 'numeric'; expected_any = @(3308) },
            @{ name = 'null'; expected_any = $null },
            @{ name = 'mixed'; expected_any = @('3308', '') }
          )) {
            $inputFile = Join-Path $work ($case.name + '.json')
            $outputDir = Join-Path $work ($case.name + '-output')
            $contents = @(@{
              id = $case.name
              kind = 'chat'
              product_id = 'example-program'
              question = 'sample'
              expected_any = $case.expected_any
            }) | ConvertTo-Json -Depth 8
            [System.IO.File]::WriteAllText($inputFile, $contents, $utf8)
            $stdout = Join-Path $work ($case.name + '-stdout.log')
            $stderr = Join-Path $work ($case.name + '-stderr.log')
            $process = Start-Process -FilePath $ps51 -ArgumentList @(
              '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $scriptPath,
              '-PackageRoot', $package, '-CasesPath', $inputFile, '-OutputDir', $outputDir
            ) -NoNewWindow -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $errorLog = Get-Content -LiteralPath $stderr -Raw
            if ($process.ExitCode -eq 0 -or (Test-Path -LiteralPath $outputDir) -or
                $errorLog -notmatch 'non-empty expected_any keywords as an array of strings') {
              throw ('Invalid chat expectations were not rejected before engine start: ' + $case.name)
            }
          }
          Write-Output 'T08_INVALID_CHAT_EXPECTATIONS_REJECTED'

  build-t07-package:
    uses: ./.github/workflows/t07-portable-windows.yml

  field-script-smoke:
    name: PowerShell 5.1 field-check using verified Windows ZIP
    needs: build-t07-package
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download freshly built and verified T07 ZIP from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: DK-Knowledge-Engine-Win-x64-demo-T07
          path: ./t08-field-input
      - name: Extract same-run T07 package
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath '.\\t08-field-input\\DK-Knowledge-Engine-Win-x64.zip' -DestinationPath '.\\t08-field-extract'
      - name: Evaluate Windows PowerShell 5.1 kit, no target Python
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File .\tests\t08_field_check.ps1 -PackageRoot .\t08-field-extract\DK-Knowledge-Engine-Win-x64 -CasesPath .\tests\t08_field_cases_sample.json -OutputDir .\t08-field-output -RunsPerChat 2
          if ($LASTEXITCODE -ne 0) { throw 'Field-check script failed' }
          $data = Get-Content '.\t08-field-output\field-validation.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($data.passed_count -ne $data.total_count -or $data.total_count -ne 7) { throw 'Unexpected case results' }
          if ($data.offline.operator_attests_disconnected_network -or $data.offline.independent_physical_offline_verification) { throw 'CI cannot claim physical airgap' }
          if ($data.PSObject.Properties.Name -contains 'hardware' -or
              $data.PSObject.Properties.Name -contains 'startup_seconds' -or
              $data.PSObject.Properties.Name -contains 'approximate_peak_process_tree_rss_mb') {
            throw 'Hardware measurements must no longer be collected'
          }
          @(
            '### T08 Windows functional field-check smoke'
            ''
            ('- Cases passed: {0}/{1}' -f $data.passed_count, $data.total_count)
            '- No RAM, CPU, GPU, latency, or RSS measurements are recorded'
            '- Physical offline: NOT verified, operator did not attest'
            '- Enterprise browser LNA and SmartScreen: manual pending'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Upload non-sensitive sample field evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: T08-Windows-field-script-smoke
          path: t08-field-output/field-validation.json
          if-no-files-found: warn
          retention-days: 7
